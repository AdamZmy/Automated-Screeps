name: 阶段计划
description: 受RCL、储备或依赖限制的工作。
title: "[计划] "
labels: ["status:planned", "priority:p2"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: 目标与价值
    validations:
      required: true
  - type: textarea
    id: gates
    attributes:
      label: 启动门槛和依赖
      description: 给出可检查的RCL、储备、道路、岗位、安全或前置Issue条件。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 具体实现与验收
      description: 涉及布局时注明研究来源、实际地形验证与必要成本。
    validations:
      required: true
